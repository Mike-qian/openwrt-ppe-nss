          \t\t\t\t\t\treg = <0x4d000 0x844>;
          \t\t\t\t\t}
          
                              caldata_art_1000: calibration@1000 {
                                  reg = <0x1000 0x20000>;
                              };;
          \t\t\t\t};
          \t\t\t};
          \t\t};
          \t};
          };
          '''
          
          # (相对路径, 说明, 旧文本, 新文本)
          EDITS = [
              # ---- mk: base 设备标注 expand layout 变体 ----
              (
                  "target/linux/qualcommax/image/ipq807x.mk",
                  "base xiaomi_ax3600 标注 expand layout 变体",
                  "define Device/xiaomi_ax3600\n"
                  "\t$(call Device/FitImage)\n"
                  "\t$(call Device/UbiFit)\n"
                  "\tDEVICE_VENDOR := Xiaomi\n"
                  "\tDEVICE_MODEL := AX3600\n"
                  "\tBLOCKSIZE := 128k",
                  "define Device/xiaomi_ax3600\n"
                  "\t$(call Device/FitImage)\n"
                  "\t$(call Device/UbiFit)\n"
                  "\tDEVICE_VENDOR := Xiaomi\n"
                  "\tDEVICE_MODEL := AX3600\n"
                  "\tDEVICE_VARIANT := (OpenWrt expand layout)\n"
                  "\tBLOCKSIZE := 128k",
              ),
              # ---- mk: 新增 xiaomi_ax3600-stock 设备定义 ----
              (
                  "target/linux/qualcommax/image/ipq807x.mk",
                  "新增 xiaomi_ax3600-stock 设备定义",
                  "endef\nTARGET_DEVICES += xiaomi_ax3600\n\ndefine Device/xiaomi_ax9000",
                  "endef\nTARGET_DEVICES += xiaomi_ax3600\n\n"
                  "define Device/xiaomi_ax3600-stock\n"
                  "\t$(call Device/xiaomi_ax3600)\n"
                  "\tDEVICE_VARIANT := (stock layout)\n"
                  "\tDEVICE_ALT0_VENDOR := Xiaomi\n"
                  "\tDEVICE_ALT0_MODEL := AX3600\n"
                  "\tDEVICE_ALT0_VARIANT := (custom U-Boot layout)\n"
                  "\tKERNEL_SIZE :=\n"
                  "\tARTIFACTS :=\n"
                  "endef\n"
                  "TARGET_DEVICES += xiaomi_ax3600-stock\n\n"
                  "define Device/xiaomi_ax9000",
              ),
              # ---- mk: 新增 redmi_ax6-stock 设备定义 ----
              (
