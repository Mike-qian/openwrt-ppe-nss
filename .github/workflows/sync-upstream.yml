          \t\t\t\t\t\treg = <0x12 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tmacaddr_dp5: macaddr@18 {
          \t\t\t\t\t\treg = <0x18 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tcaldata_qca9889: caldata@4d000 {
          \t\t\t\t\t\treg = <0x33000 0x844>;
          \t\t\t\t\t}
          
                              caldata_art_1000: calibration@1000 {
                                  reg = <0x1000 0x20000>;
                              };;
          \t\t\t\t};
          \t\t\t};
