          \t};
          };
          
          &qpic_nand {
          \t/delete-node/ partitions;
          
          \tnand@0 {
          \t\t/delete-node/ partitions;
          
          \t\tpartitions {
          \t\t\tcompatible = "qcom,smem-part";
          
          \t\t\tpartition-0-art {
