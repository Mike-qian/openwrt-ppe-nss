                  "TARGET_DEVICES += redmi_ax6\n\n"
                  "define Device/redmi_ax6-stock\n"
                  "\t$(call Device/redmi_ax6)\n"
                  "\tDEVICE_VARIANT := (stock layout)\n"
                  "\tDEVICE_ALT0_VENDOR := Redmi\n"
                  "\tDEVICE_ALT0_MODEL := AX6\n"
                  "\tDEVICE_ALT0_VARIANT := (custom U-Boot layout)\n"
                  "\tKERNEL_SIZE :=\n"
                  "\tARTIFACTS :=\n"
                  "endef\n"
                  "TARGET_DEVICES += redmi_ax6-stock\n\n"
                  "define Device/spectrum_sax1v1k",
              ),
              # ---- mk: 新增 xiaomi_ax9000-stock 设备定义 ----
              (
                  "target/linux/qualcommax/image/ipq807x.mk",
                  "新增 xiaomi_ax9000-stock 设备定义",
                  "TARGET_DEVICES += xiaomi_ax9000\n\ndefine Device/yuncore_ax880",
                  "TARGET_DEVICES += xiaomi_ax9000\n\n"
                  "define Device/xiaomi_ax9000-stock\n"
                  "\t$(call Device/xiaomi_ax9000)\n"
                  "\tDEVICE_VARIANT := (stock layout)\n"
                  "\tDEVICE_ALT0_VENDOR := Xiaomi\n"
                  "\tDEVICE_ALT0_MODEL := AX9000\n"
                  "\tDEVICE_ALT0_VARIANT := (custom U-Boot layout)\n"
                  "\tKERNEL_SIZE :=\n"
                  "\tARTIFACTS :=\n"
                  "endef\n"
                  "TARGET_DEVICES += xiaomi_ax9000-stock\n\n"
                  "define Device/yuncore_ax880",
              ),
              # ---- platform.sh: stock 双分区升级 case（三设备共用）----
              (
                  "target/linux/qualcommax/ipq807x/base-files/lib/upgrade/platform.sh",
                  "stock 双分区升级 case",
                  '\t\t# Kernel and rootfs are placed in 2 different UBI\n'
                  '\t\tCI_KERN_UBIPART="ubi_kernel"\n'
                  '\t\tCI_ROOT_UBIPART="rootfs"\n'
                  '\t\tCI_DATA_UBIPART="rootfs"\n'
                  '\t\tnand_do_upgrade "$1"\n'
                  "\t\t;;\n"
                  "\tspectrum,sax1v1k)",
                  '\t\t# Kernel and rootfs are placed in 2 different UBI\n'
                  '\t\tCI_KERN_UBIPART="ubi_kernel"\n'
                  '\t\tCI_ROOT_UBIPART="rootfs"\n'
                  '\t\tCI_DATA_UBIPART="rootfs"\n'
                  '\t\tnand_do_upgrade "$1"\n'
                  "\t\t;;\n"
                  "\tredmi,ax6-stock|\\\n"
                  "\txiaomi,ax3600-stock|\\\n"
                  "\txiaomi,ax9000-stock)\n"
                  '\t\tpart_num="$(fw_printenv -n flag_boot_rootfs)"\n'
                  '\t\tif [ "$part_num" -eq "1" ]; then\n'
                  '\t\t\tCI_UBIPART="rootfs_1"\n'
                  "\t\t\ttarget_num=1\n"
                  "\t\t\tfw_setenv flag_try_sys2_failed 0\n"
                  "\t\telse\n"
                  '\t\t\tCI_UBIPART="rootfs"\n'
                  "\t\t\ttarget_num=0\n"
                  "\t\t\tfw_setenv flag_try_sys1_failed 0\n"
                  "\t\tfi\n"
                  '\t\tfw_setenv flag_boot_rootfs "$target_num"\n'
                  '\t\tfw_setenv flag_last_success "$target_num"\n'
                  '\t\tfw_setenv flag_boot_success 0\n'
                  '\t\tnand_do_upgrade "$1"\n'
                  "\t\t;;\n"
