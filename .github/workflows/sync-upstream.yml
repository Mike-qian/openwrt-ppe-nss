name: Sync upstream & re-apply stock layouts

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo (owner/name)'
        required: true
        default: 'JuliusBairaktaris/openwrt-ppe-nss'
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'ppe-nss'
      force_reapply:
        description: 'Force re-apply even if no new commits'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git || git remote set-url upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Check for new commits
        id: check
        run: |
          UP=$(git rev-list HEAD..upstream/${{ github.event.inputs.upstream_branch }} | wc -l)
          echo "new_commits=$UP" >> "$GITHUB_OUTPUT"
          if [ "$UP" -eq "0" ] && [ "${{ github.event.inputs.force_reapply }}" != "true" ]; then
            echo "no_new_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync upstream (merge -X theirs + re-apply stock layouts)
        if: steps.check.outputs.no_new_commits == 'false'
        run: |
          UB="${{ github.event.inputs.upstream_branch }}"
          # 上游演进可能改动非适配文件；-X theirs 对所有冲突（含 add/add）一律取上游，
          # 然后由下面的脚本重打适配覆盖回去。无需 force-push，且自动保留 .github/ 专属文件。
          if ! git merge -X theirs --no-commit --no-edit upstream/$UB; then
            git checkout --theirs . 2>/dev/null || true
            git add -A
          fi
          python3 - . <<'PY'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          ax3600/ax6/ax9000 stock 适配补丁脚本（幂等）
          把 immortalwrt owrt 的 xiaomi_ax3600-stock / redmi_ax6-stock / xiaomi_ax9000-stock
          支持应用到 OpenWrt qualcommax/ipq807x 源码树（基于上游 master，base DTS 用
          fixed-partitions，因此需要显式写 &qpic_nand smem-part 块）。
          
          用法:
              python apply_ax3600_stock.py [源码树路径]
              源码树路径默认为 C:/Users/Mike1/Downloads/openwrt-ppe-nss-ppe-nss
          
          特性:
              - 幂等：已应用的修改会跳过，可重复运行
              - 每个修改先验证锚点存在，找不到时报错并指出文件
              - 同时写入各设备的 stock 布局 DTS 新文件
          """
          
          import os
          import sys
          
          TREE = sys.argv[1] if len(sys.argv) > 1 else r"C:/Users/Mike1/Downloads/openwrt-ppe-nss-ppe-nss"
          
          # ---------------------------------------------------------------------------
          # DTS 内容（长版：base DTS 用 fixed-partitions，stock 需显式改 smem-part）
          # ---------------------------------------------------------------------------
          
          DTS_AX3600 = '''// SPDX-License-Identifier: GPL-2.0-or-later OR MIT
          /*
           * Copyright (c) 2020, 2021, 2022, 2023, 2024, 2025
           * Chukun Pan
           */
          
          #include "ipq8071-ax3600.dts"
          
          / {
          \tmodel = "Xiaomi AX3600 (stock layout)";
          \tcompatible = "xiaomi,ax3600-stock", "qcom,ipq8074";
          
          \tchosen {
          \t\tbootargs-append = " root=/dev/ubiblock0_1";
          \t};
          };
          
          &qpic_nand {
          \t/delete-node/ partitions;
          
          \tnand@0 {
          \t\t/delete-node/ partitions;
          
          \t\tpartitions {
          \t\t\tcompatible = "qcom,smem-part";
          
          \t\t\tpartition-0-art {
          \t\t\t\tlabel = "0:art";
          \t\t\t\tread-only;
          
          \t\t\t\tnvmem-layout {
          \t\t\t\t\tcompatible = "fixed-layout";
          \t\t\t\t\t#address-cells = <1>;
          \t\t\t\t\t#size-cells = <1>;
          
          \t\t\t\t\tmacaddr_dp2: macaddr@6 {
          \t\t\t\t\t\treg = <0x6 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tmacaddr_dp3: macaddr@c {
          \t\t\t\t\t\treg = <0xc 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tmacaddr_dp4: macaddr@12 {
          \t\t\t\t\t\treg = <0x12 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tmacaddr_dp5: macaddr@18 {
          \t\t\t\t\t\treg = <0x18 0x6>;
          \t\t\t\t\t};
          
          \t\t\t\t\tcaldata_qca9889: caldata@4d000 {
          \t\t\t\t\t\treg = <0x33000 0x844>;
          \t\t\t\t\t}
          
                              caldata_art_1000: calibration@1000 {
                                  reg = <0x1000 0x20000>;
                              };;
          \t\t\t\t};
          \t\t\t};
          \t\t};
          \t};
          };
          '''
          
          DTS_AX6 = '''// SPDX-License-Identifier: GPL-2.0-or-later OR MIT
