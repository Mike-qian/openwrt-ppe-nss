          # (相对路径, 说明, 内容, 已应用判定串)
          DTS_FILES = [
              ("target/linux/qualcommax/dts/ipq8071-ax3600-stock.dts",
               "ipq8071-ax3600-stock.dts", DTS_AX3600, "xiaomi,ax3600-stock"),
              ("target/linux/qualcommax/dts/ipq8071-ax6-stock.dts",
               "ipq8071-ax6-stock.dts", DTS_AX6, "redmi,ax6-stock"),
              ("target/linux/qualcommax/dts/ipq8072-ax9000-stock.dts",
               "ipq8072-ax9000-stock.dts", DTS_AX9000, "xiaomi,ax9000-stock"),
          ]
          
          
          def main():
              if not os.path.isdir(TREE):
                  sys.exit("错误：源码树路径不存在: %s" % TREE)
          
              applied, skipped, failed = 0, 0, 0
          
              for rel, desc, old, new in EDITS:
                  path = os.path.join(TREE, rel)
                  if not os.path.isfile(path):
                      print("[FAIL] %s：文件不存在 (%s)" % (desc, rel))
                      failed += 1
                      continue
                  with open(path, "r", encoding="utf-8", newline="") as f:
                      content = f.read()
                  if new in content:
                      print("[SKIP] %s：已应用" % desc)
                      skipped += 1
                      continue
                  if old not in content:
                      print("[FAIL] %s：锚点未找到，请人工检查 (%s)" % (desc, rel))
                      failed += 1
                      continue
                  # 保留原文件换行符风格
                  nl = "\r\n" if "\r\n" in content else "\n"
                  old_n = old.replace("\n", nl) if nl != "\n" else old
                  new_n = new.replace("\n", nl) if nl != "\n" else new
                  content = content.replace(old_n, new_n, 1)
                  with open(path, "w", encoding="utf-8", newline="") as f:
                      f.write(content)
                  print("[OK]   %s" % desc)
                  applied += 1
          
              for rel, desc, dts, compat in DTS_FILES:
                  dts_path = os.path.join(TREE, rel)
                  if os.path.isfile(dts_path):
                      with open(dts_path, "r", encoding="utf-8", newline="") as f:
                          existing = f.read()
                      if (compat in existing) and ("qcom,smem-part" in existing):
                          print("[SKIP] %s：已存在且内容正确" % desc)
                          skipped += 1
                      else:
                          with open(dts_path, "w", encoding="utf-8", newline="") as f:
                              f.write(dts)
                          print("[OK]   %s：内容已更新" % desc)
                          applied += 1
                  else:
                      with open(dts_path, "w", encoding="utf-8", newline="") as f:
                          f.write(dts)
                      print("[OK]   %s：已创建" % desc)
                      applied += 1
          
              print("\n结果：应用 %d 项，跳过 %d 项，失败 %d 项" % (applied, skipped, failed))
              if failed:
                  sys.exit(1)
          
          
          if __name__ == "__main__":
              main()
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "sync: merge upstream $UB and re-apply ax3600/ax6/ax9000 stock layouts"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: No new commits
        if: steps.check.outputs.no_new_commits == 'true'
        run: echo "Upstream has no new commits; nothing to do."
