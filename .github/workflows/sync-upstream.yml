                  "xiaomi,ax9000-stock)\n",
              ),
              # ---- init.d/bootcount: bootcount 增加三 stock 变体 ----
              (
                  "target/linux/qualcommax/ipq807x/base-files/etc/init.d/bootcount",
                  "bootcount 增加 stock 变体",
                  "\tnetgear,wax620|\\\n"
                  "\tnetgear,wax630)\n"
                  "\t\tfw_setenv boot_count 0\n"
                  "\t;;\n"
                  "\tesac",
                  "\tnetgear,wax620|\\\n"
                  "\tnetgear,wax630)\n"
                  "\t\tfw_setenv boot_count 0\n"
                  "\t;;\n"
                  "\tredmi,ax6-stock|\\\n"
                  "\txiaomi,ax3600-stock|\\\n"
                  "\txiaomi,ax9000-stock)\n"
