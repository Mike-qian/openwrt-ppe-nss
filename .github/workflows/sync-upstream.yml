              # ---- 11-ath11k-caldata: QCN9074 段 ax9000-stock 变体 ----
              # 本树(上游 OpenWrt master qualcommax)的 ax3600/ax6 校准走 nvmem
              # (stock DTS 继承 base 的 wifi nvmem-cells = <&caldata_qca9889>),不在
              # hotplug 段,故无需在此加;仅 ax9000 带 QCN9074(PCIe 无线)需在此段取
              # 校准,补 ax9000-stock 变体即可。
              (
                  "target/linux/qualcommax/ipq807x/base-files/etc/hotplug.d/firmware/11-ath11k-caldata",
                  "校准数据提取增加 ax9000-stock 变体",
