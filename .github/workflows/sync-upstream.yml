           * Copyright (c) 2020, 2021, 2022, 2023, 2024, 2025
           * Chukun Pan
           */
          
          #include "ipq8072-ax9000.dts"
          
          / {
          \tmodel = "Xiaomi AX9000 (stock layout)";
          \tcompatible = "xiaomi,ax9000-stock", "qcom,ipq8074";
          
          \taliases {
          \t\t/* Aliases as required by u-boot to patch MAC addresses */
          \t\tethernet1 = &lan4;
          \t\tethernet2 = &lan3;
          \t\tethernet3 = &lan2;
          \t\tethernet4 = &lan1;
          \t\tethernet5 = &wan;
          \t};
          
          \tchosen {
          \t\tbootargs-append = " root=/dev/ubiblock0_1";
          \t};
          };
          
          &qpic_nand {
          \t/delete-node/ partitions;
          
          \tnand@0 {
          \t\t/delete-node/ partitions;
          
          \t\tpartitions {
